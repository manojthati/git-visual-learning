<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Git Visually — reader</title>
<meta name="description" content="Eleven illustrated git modules: three trees, branching, merging, rebase, stacked branches, stash, cherry-pick, strategies, undoing, remotes and advanced tools.">
<meta property="og:title" content="Learn Git — Visually">
<meta property="og:type" content="article">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23071320'/%3E%3Cpath d='M10 7v18M10 16c0-5 12-4 12-9' stroke='%2338bdf8' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='10' cy='25' r='3.2' fill='%2334d399'/%3E%3Ccircle cx='22' cy='7' r='3.2' fill='%23fbbf24'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#071320; --panel:#0b1c2c; --card:#0d2233; --ink:#e2e8f0; --slate:#94a3b8;
    --cyan:#38bdf8; --amber:#fbbf24; --green:#34d399; --rose:#fb7185; --violet:#c084fc;
    --edge:rgba(56,189,248,.25);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:70px}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65}
  a{color:var(--cyan)}

  /* top bar */
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
    padding:10px 16px;background:rgba(7,19,32,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--edge);font-family:var(--mono);font-size:13px}
  .top .home{color:var(--ink);text-decoration:none;font-weight:600;white-space:nowrap}
  .top .spacer{flex:1}
  .menu-btn{display:none;background:none;border:1px solid var(--edge);color:var(--ink);
    border-radius:8px;padding:5px 10px;font:inherit;cursor:pointer}
  .chip{border:1px solid var(--edge);border-radius:999px;padding:3px 12px;color:var(--slate);white-space:nowrap}
  .chip b{color:var(--ink)}
  .bar{position:absolute;left:0;bottom:-1px;height:2px;background:var(--cyan);width:0;transition:width .2s}

  /* layout */
  .wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1280px;margin:0 auto}
  @media (min-width:1150px){ .wrap{grid-template-columns:270px minmax(0,1fr) 230px} }
  nav.side{position:sticky;top:49px;align-self:start;height:calc(100vh - 49px);overflow:auto;
    padding:22px 14px 40px;border-right:1px solid var(--edge);font-family:var(--mono);font-size:13px}
  nav.side h3{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--slate);margin:18px 8px 8px}
  nav.side h3:first-child{margin-top:0}
  nav.side a{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:7px;
    color:var(--slate);text-decoration:none}
  nav.side a:hover{background:var(--card);color:var(--ink)}
  nav.side a.on{background:var(--card);color:var(--ink);box-shadow:inset 2px 0 0 var(--cyan)}
  nav.side a .tick{width:14px;flex:none;color:var(--green)}
  nav.side .prog{margin:4px 8px 0;color:var(--slate);font-size:12px}
  nav.side .track{height:5px;border-radius:9px;background:var(--card);margin:6px 8px 0;overflow:hidden}
  nav.side .track i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}

  main{padding:28px clamp(16px,4vw,56px) 90px;min-width:0}
  article{max-width:860px}
  article h1{font-size:clamp(26px,4vw,36px);line-height:1.2;margin:4px 0 18px;letter-spacing:-.5px}
  article h2{font-size:20px;margin:42px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--edge)}
  article h3{font-size:17px;margin:28px 0 10px}
  article p,article li{color:#cbd5e1}
  article strong{color:var(--ink)}
  article hr{border:0;border-top:1px dashed var(--edge);margin:34px 0}
  article img{max-width:100%;height:auto;display:block;margin:14px 0;border-radius:12px;
    background:var(--panel);border:1px solid var(--edge)}
  article blockquote{margin:18px 0;padding:12px 18px;border-left:3px solid var(--amber);
    background:rgba(251,191,36,.06);border-radius:0 10px 10px 0}
  article blockquote p{margin:6px 0}
  article code{font-family:var(--mono);font-size:.88em;background:var(--card);padding:2px 6px;border-radius:5px;color:#e0f2fe}
  article pre{position:relative;background:var(--panel);border:1px solid var(--edge);border-radius:10px;
    padding:14px 16px;overflow:auto;font-size:13px;line-height:1.55}
  article pre code{background:none;padding:0;color:#e2e8f0}
  .copy{position:absolute;top:8px;right:8px;font:11px var(--mono);background:var(--card);color:var(--slate);
    border:1px solid var(--edge);border-radius:6px;padding:3px 8px;cursor:pointer;opacity:.75}
  .copy:hover{opacity:1;color:var(--ink)}
  .tbl{overflow-x:auto;margin:14px 0}
  article table{border-collapse:collapse;width:100%;font-size:14px}
  article th,article td{border:1px solid var(--edge);padding:8px 10px;text-align:left;vertical-align:top}
  article th{background:var(--card);color:var(--ink)}
  .mermaid{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:14px;
    margin:14px 0;overflow-x:auto;text-align:center}

  /* per-module metadata badges, under h1 */
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
  .badges .b{font:11px var(--mono);border:1px solid var(--edge);border-radius:999px;padding:4px 12px;
    color:var(--slate);display:inline-flex;align-items:center;gap:5px;text-decoration:none;background:var(--card)}
  .badges a.b{border-color:rgba(251,191,36,.45);color:var(--amber)}
  .badges a.b:hover{background:rgba(251,191,36,.1)}

  /* right-hand "on this page" toc */
  aside.toc{display:none}
  @media (min-width:1150px){
    aside.toc{display:block;position:sticky;top:49px;align-self:start;height:calc(100vh - 49px);overflow:auto;
      padding:28px 10px 40px 14px;font-family:var(--mono);font-size:12.5px;border-left:1px solid var(--edge)}
    aside.toc h4{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--slate);margin:0 0 10px}
    aside.toc a{display:block;padding:5px 10px;border-radius:7px;color:var(--slate);text-decoration:none;
      border-left:2px solid transparent;line-height:1.4}
    aside.toc a.h3{padding-left:22px;font-size:12px}
    aside.toc a:hover{color:var(--ink)}
    aside.toc a.on{color:var(--cyan);border-left-color:var(--cyan);background:rgba(56,189,248,.06)}
  }

  /* flashcards & answers */
  article details{margin:12px 0;border:1px solid var(--edge);border-radius:12px;background:var(--card);overflow:hidden}
  article details>summary{cursor:pointer;list-style:none;padding:13px 16px 13px 42px;position:relative;color:var(--ink);font-weight:500}
  article details>summary::-webkit-details-marker{display:none}
  article details>summary::before{content:"▸";position:absolute;left:17px;top:12px;color:var(--cyan);transition:transform .15s}
  article details[open]>summary::before{transform:rotate(90deg)}
  article details>summary:hover{background:rgba(56,189,248,.06)}
  article details>:not(summary){padding:0 18px}
  article details[open]{border-color:rgba(56,189,248,.5)}
  .grade{display:flex;gap:8px;flex-wrap:wrap;padding:4px 18px 14px !important;font-family:var(--mono);font-size:12px}
  .grade button{font:inherit;cursor:pointer;border-radius:8px;padding:6px 12px;background:transparent;border:1px solid var(--edge);color:var(--slate)}
  .grade button.got.sel{border-color:var(--green);color:var(--green);background:rgba(52,211,153,.1)}
  .grade button.miss.sel{border-color:var(--rose);color:var(--rose);background:rgba(251,113,133,.1)}
  details.g-got{border-color:rgba(52,211,153,.55)}
  details.g-miss{border-color:rgba(251,113,133,.55)}

  .done-box{margin-top:40px;padding:18px;border:1px solid var(--edge);border-radius:14px;background:var(--card);
    display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .btn{font:13px var(--mono);cursor:pointer;border-radius:9px;padding:9px 16px;border:1px solid var(--cyan);
    background:transparent;color:var(--cyan);text-decoration:none;display:inline-block}
  .btn.ok{border-color:var(--green);color:var(--green);background:rgba(52,211,153,.1)}
  .pager{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
  .pager a{flex:1 1 220px;padding:14px 16px;border:1px solid var(--edge);border-radius:12px;text-decoration:none;
    color:var(--ink);background:var(--card)}
  .pager a small{display:block;color:var(--slate);font-family:var(--mono);font-size:11px}
  .pager a.next{text-align:right}
  .tryit{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 22px;
    padding:14px 16px;border:1px solid rgba(251,191,36,.45);background:rgba(251,191,36,.07);border-radius:12px}
  .tryit b{color:var(--amber)} .tryit span{color:#cbd5e1;font-size:14px}
  .tryit .btn{border-color:var(--amber);color:var(--amber)}
  .top .nl{color:var(--slate);text-decoration:none} .top .nl:hover{color:var(--ink)}
  .keys{color:var(--slate);font:11px var(--mono);margin-top:10px}
  .keys kbd{border:1px solid var(--edge);border-radius:4px;padding:0 5px}
  .src{margin-top:26px;font-size:12px;color:var(--slate);font-family:var(--mono)}
  .loading,.err{color:var(--slate);font-family:var(--mono);padding:40px 0}

  @media (max-width:860px){
    .wrap{grid-template-columns:1fr}
    .menu-btn{display:inline-block}
    nav.side{position:fixed;left:0;top:49px;width:min(300px,85vw);background:var(--bg);z-index:15;
      transform:translateX(-102%);transition:transform .2s;box-shadow:8px 0 30px rgba(0,0,0,.5)}
    body.nav-open nav.side{transform:none}
    .top .chip.score{display:none}
  }
</style>
</head>
<body>

<div class="top">
  <button class="menu-btn" id="menuBtn" aria-label="Show modules">☰</button>
  <a class="home" href="./">⎇ Learn Git — Visually</a>
  <a class="nl" href="playground.html">Playground</a>
  <span class="spacer"></span>
  <span data-account></span>
  <span class="chip score" id="scoreChip" hidden></span>
  <span class="chip" id="progChip"></span>
  <div class="bar" id="readBar"></div>
</div>

<div class="wrap">
  <nav class="side" id="side" aria-label="Modules"></nav>
  <main>
    <article id="doc"><div class="loading">Loading…</div></article>
    <div id="after"></div>
  </main>
  <aside class="toc" id="toc" aria-label="On this page"></aside>
</div>

<script src="progress.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
(function(){
  var REPO = "https://github.com/manojthati/git-visual-learning/blob/main/";
  var MODULES = [
    ["00-how-to-read-this","00","How to read this"],
    ["01-three-trees","01","The Three Trees"],
    ["02-branching-basics","02","Branching Basics"],
    ["03-merging","03","Merging"],
    ["04-rebase","04","Rebase"],
    ["05-stacked-branches","05","Stacked Branches"],
    ["06-stashing","06","Stashing"],
    ["07-cherry-picking","07","Cherry-Picking"],
    ["08-branching-strategies","08","Branching Strategies"],
    ["09-undoing-things","09","Undoing Things"],
    ["10-remote-workflows","10","Remote Workflows"],
    ["11-advanced-toolbox","11","The Advanced Toolbox"]
  ];
  var PRACTICE = [
    ["flashcards","🃏","Flashcard deck"],
    ["quiz","❓","Quiz bank"],
    ["cheatsheet-commands","📋","Command cheat sheet"]
  ];
  var TRY = {
    "00-how-to-read-this":["first-commits","Make your first commits"],
    "01-three-trees":["three-trees","Walk a change through the three trees"],
    "02-branching-basics":["branching","Create a branch and commit on it"],
    "03-merging":["ff-merge","Fast-forward, then a three-way merge"],
    "04-rebase":["rebase","Rebase a branch into a straight line"],
    "05-stacked-branches":["restack","Restack a branch after its base moves"],
    "06-stashing":["stash","Stash your work to ship a hotfix"],
    "07-cherry-picking":["cherry-pick","Cherry-pick a single fix"],
    "08-branching-strategies":["three-way","Merge two diverged branches"],
    "09-undoing-things":["reset","Undo with reset, then with revert"],
    "10-remote-workflows":["revert","Undo a commit that's already pushed"],
    "11-advanced-toolbox":["reflog","Rescue lost work with reflog"]
  };
  var ALL = MODULES.concat(PRACTICE);
  var known = {}; ALL.forEach(function(m){ known[m[0]] = m; });

  // ---------- storage (best effort; page works without it)
  function load(k, d){ try{ var v = localStorage.getItem("gvl:"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
  function save(k, v){ try{ localStorage.setItem("gvl:"+k, JSON.stringify(v)); }catch(e){} }
  var done = load("done", {});

  var params = new URLSearchParams(location.search);
  var slug = params.get("m") || MODULES[0][0];
  if(!known[slug]) slug = MODULES[0][0];
  var current = known[slug];
  save("last", slug);

  // ---------- sidebar
  var side = document.getElementById("side");
  function link(m, prefix){
    var a = document.createElement("a");
    a.href = "learn.html?m=" + m[0];
    if(m[0] === slug) a.className = "on";
    a.innerHTML = '<span class="tick">' + (done[m[0]] ? "✓" : "") + '</span><span>' +
      (prefix ? prefix + " · " : "") + m[2] + '</span>';
    return a;
  }
  function renderSide(){
    side.innerHTML = "";
    var h = document.createElement("h3"); h.textContent = "Modules"; side.appendChild(h);
    MODULES.forEach(function(m){ side.appendChild(link(m, m[1])); });
    var n = MODULES.filter(function(m){ return done[m[0]]; }).length;
    var p = document.createElement("div"); p.className = "prog";
    p.textContent = n + " of " + MODULES.length + " complete"; side.appendChild(p);
    var t = document.createElement("div"); t.className = "track";
    t.innerHTML = '<i style="width:' + Math.round(100*n/MODULES.length) + '%"></i>'; side.appendChild(t);
    var h2 = document.createElement("h3"); h2.textContent = "Practice"; side.appendChild(h2);
    PRACTICE.forEach(function(m){ side.appendChild(link(m, m[1])); });
    var sy = document.createElement("a"); sy.href = "#"; sy.setAttribute("data-sync", ""); sy.style.marginTop = "14px";
    sy.innerHTML = '<span class="tick">⇄</span><span>Sync progress to another device</span>'; side.appendChild(sy);
    document.getElementById("progChip").innerHTML = "<b>" + n + "</b>/" + MODULES.length + " done";
  }
  renderSide();
  document.getElementById("menuBtn").onclick = function(){ document.body.classList.toggle("nav-open"); };
  side.addEventListener("click", function(e){ if(e.target.closest("a")) document.body.classList.remove("nav-open"); });

  // ---------- GitHub-style heading ids so in-page anchors (#level-1--recall) keep working
  function ghSlug(text){
    return text.trim().toLowerCase()
      .replace(/<[^>]+>/g, "")
      .replace(/[^\p{L}\p{N}\s_-]/gu, "")
      .replace(/\s/g, "-");
  }

  // ---------- rewrite repo-relative links/images for the site
  function rewrite(root){
    root.querySelectorAll("img[src]").forEach(function(img){
      var s = img.getAttribute("src");
      if(s.indexOf("../assets/") === 0) img.setAttribute("src", s.slice(3));
      img.loading = "lazy";
    });
    root.querySelectorAll("a[href]").forEach(function(a){
      var h = a.getAttribute("href");
      if(/^(https?:|mailto:|#)/.test(h)) { if(/^https?:/.test(h)){ a.target = "_blank"; a.rel = "noopener"; } return; }
      var m = h.match(/^(?:\.\.\/docs\/|\.\/)?([\w-]+)\.md(#.*)?$/);
      if(m && known[m[1]]) { a.setAttribute("href", "learn.html?m=" + m[1] + (m[2] || "")); return; }
      if(/^\.\.\/README\.md/.test(h)) { a.setAttribute("href", "./"); return; }
      // anything else (examples/, LICENSE…) lives only in the repo
      a.setAttribute("href", REPO + h.replace(/^\.\.\//, "").replace(/^\.\//, "docs/"));
      a.target = "_blank"; a.rel = "noopener";
    });
  }

  // ---------- self-graded answers & flashcards
  var score = load("score:" + slug, {});
  var chip = document.getElementById("scoreChip");
  function updateScore(total){
    var got = 0, miss = 0;
    Object.keys(score).forEach(function(k){ if(score[k] === "got") got++; else if(score[k] === "miss") miss++; });
    if(!total){ chip.hidden = true; return; }
    chip.hidden = false;
    chip.innerHTML = "✓ <b>" + got + "</b> · ✗ <b>" + miss + "</b> · " + (total - got - miss) + " left";
  }
  function addGrading(root){
    var cards = root.querySelectorAll("details");
    cards.forEach(function(d, i){
      var key = "c" + i;
      var g = document.createElement("div"); g.className = "grade";
      g.innerHTML = '<button class="got">✓ I knew it</button><button class="miss">✗ Missed it</button>';
      d.appendChild(g);
      function paint(){
        var v = score[key];
        d.classList.toggle("g-got", v === "got"); d.classList.toggle("g-miss", v === "miss");
        g.querySelector(".got").classList.toggle("sel", v === "got");
        g.querySelector(".miss").classList.toggle("sel", v === "miss");
      }
      g.addEventListener("click", function(e){
        var b = e.target.closest("button"); if(!b) return;
        var v = b.classList.contains("got") ? "got" : "miss";
        score[key] = score[key] === v ? undefined : v;
        if(!score[key]) delete score[key];
        save("score:" + slug, score); paint(); updateScore(cards.length);
      });
      paint();
    });
    if(cards.length){
      var reset = document.createElement("button");
      reset.className = "btn"; reset.textContent = "Reset my answers";
      reset.onclick = function(){ score = {}; save("score:" + slug, score); location.reload(); };
      root.appendChild(reset);
    }
    updateScore(cards.length);
  }

  // ---------- metadata badges under h1 (real counts, not decoration)
  function buildMeta(root){
    var h1 = root.querySelector("h1");
    if(!h1) return;
    var sections = root.querySelectorAll("h2").length;
    var blocks = root.querySelectorAll("pre").length;
    var animated = !!root.querySelector(".mermaid, img[src*='assets/anim']");
    var parts = [];
    if(sections) parts.push('<span class="b">' + sections + " section" + (sections === 1 ? "" : "s") + "</span>");
    if(blocks) parts.push('<span class="b">' + blocks + " command block" + (blocks === 1 ? "" : "s") + "</span>");
    if(animated) parts.push('<span class="b">🎬 animated</span>');
    if(TRY[slug]) parts.push('<a class="b" href="playground.html?c=' + TRY[slug][0] + '">🧪 practice included</a>');
    if(!parts.length) return;
    var row = document.createElement("div"); row.className = "badges"; row.innerHTML = parts.join("");
    h1.insertAdjacentElement("afterend", row);
  }

  // ---------- right-hand "on this page" toc, scroll-spied
  function buildToc(root){
    var toc = document.getElementById("toc");
    var heads = root.querySelectorAll("h2, h3");
    toc.innerHTML = "";
    if(!heads.length) return;
    var h = document.createElement("h4"); h.textContent = "On this page"; toc.appendChild(h);
    var links = [];
    heads.forEach(function(el){
      var a = document.createElement("a");
      a.href = "#" + el.id;
      a.textContent = el.textContent;
      if(el.tagName === "H3") a.className = "h3";
      a.dataset.target = el.id;
      toc.appendChild(a);
      links.push(a);
    });
    if(!("IntersectionObserver" in window)) return;
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(!en.isIntersecting) return;
        links.forEach(function(l){ l.classList.remove("on"); });
        var a = toc.querySelector('a[data-target="' + en.target.id + '"]');
        if(a) a.classList.add("on");
      });
    }, {rootMargin: "-80px 0px -70% 0px"});
    heads.forEach(function(el){ obs.observe(el); });
  }

  function addCopyButtons(root){
    root.querySelectorAll("pre").forEach(function(pre){
      var b = document.createElement("button"); b.className = "copy"; b.textContent = "copy";
      b.onclick = function(){
        var t = pre.querySelector("code").innerText;
        (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(
          function(){ b.textContent = "copied"; setTimeout(function(){ b.textContent = "copy"; }, 1200); },
          function(){ b.textContent = "select & ⌘C"; });
      };
      pre.appendChild(b);
    });
  }

  function footer(){
    var after = document.getElementById("after");
    var idx = MODULES.findIndex(function(m){ return m[0] === slug; });
    var html = "";
    if(idx >= 0){
      html += '<div class="done-box"><span>' + (done[slug] ? "You've completed this module." : "Finished reading? Mark it done to track your progress.") +
        '</span><button class="btn' + (done[slug] ? " ok" : "") + '" id="doneBtn">' + (done[slug] ? "✓ Completed" : "Mark module complete") + '</button></div>';
      var prev = MODULES[idx-1], next = MODULES[idx+1] || PRACTICE[0];
      html += '<div class="pager">' +
        (prev ? '<a href="learn.html?m=' + prev[0] + '"><small>← previous</small>' + prev[1] + " · " + prev[2] + '</a>' : "<span></span>") +
        '<a class="next" href="learn.html?m=' + next[0] + '"><small>next →</small>' + (next[1].length < 3 && /\d/.test(next[1]) ? next[1] + " · " : "") + next[2] + '</a></div>';
    }
    if(TRY[slug]) html += '<div class="done-box"><span>🧪 Practice what you just read: <b style="color:var(--amber)">' + TRY[slug][1] + '</b></span><a class="btn" href="playground.html?c=' + TRY[slug][0] + '">Open the playground →</a></div>';
    html += '<div class="keys">Keyboard: <kbd>←</kbd> previous · <kbd>→</kbd> next</div>';
    html += '<div class="src">Source: <a href="' + REPO + 'docs/' + slug + '.md" target="_blank" rel="noopener">docs/' + slug + '.md on GitHub</a></div>';
    after.innerHTML = html;
    var btn = document.getElementById("doneBtn");
    if(btn) btn.onclick = function(){
      if(done[slug]) delete done[slug]; else done[slug] = true;
      save("done", done); renderSide(); footer();
    };
  }

  // ---------- keyboard: ← / → between modules
  addEventListener("keydown", function(e){
    if(e.altKey || e.ctrlKey || e.metaKey || /input|textarea|select/i.test((e.target.tagName || ""))) return;
    var i = ALL.findIndex(function(m){ return m[0] === slug; });
    if(e.key === "ArrowRight" && ALL[i+1]) location.href = "learn.html?m=" + ALL[i+1][0];
    if(e.key === "ArrowLeft" && ALL[i-1]) location.href = "learn.html?m=" + ALL[i-1][0];
  });

  // ---------- reading progress bar
  addEventListener("scroll", function(){
    var h = document.documentElement, max = h.scrollHeight - h.clientHeight;
    document.getElementById("readBar").style.width = (max > 0 ? 100 * h.scrollTop / max : 0) + "%";
  }, {passive:true});

  // ---------- render
  document.title = current[2] + " — Learn Git Visually";
  var doc = document.getElementById("doc");
  fetch("docs/" + slug + ".md").then(function(r){
    if(!r.ok) throw new Error(r.status);
    return r.text();
  }).then(function(md){
    // drop the in-file "⬅️ prev · index · next ➡️" line: the reader has its own pager
    md = md.replace(/\n-{3,}\s*\n+⬅️[^\n]*\s*$/, "\n").replace(/\n⬅️[^\n]*\s*$/, "\n");
    var renderer = new marked.Renderer();
    renderer.heading = function(text, level, raw){
      return "<h" + level + ' id="' + ghSlug(raw) + '">' + text + "</h" + level + ">\n";
    };
    renderer.code = function(code, lang){
      if(lang === "mermaid") return '<div class="mermaid">' + code.replace(/</g,"&lt;") + "</div>";
      var esc = code.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      return '<pre><code class="language-' + (lang || "") + '">' + esc + "</code></pre>";
    };
    renderer.table = function(header, body){
      return '<div class="tbl"><table><thead>' + header + "</thead><tbody>" + body + "</tbody></table></div>";
    };
    doc.innerHTML = marked.parse(md, {renderer: renderer, gfm: true});
    rewrite(doc);
    buildMeta(doc);
    if(TRY[slug]){
      var pgDone = load("pg", {});
      var box = document.createElement("div"); box.className = "tryit";
      box.innerHTML = '<span><b>🧪 Try it yourself</b> · </span><a class="btn" href="playground.html?c=' + TRY[slug][0] + '">' +
        (pgDone[TRY[slug][0]] ? "✓ Solved · play again" : "Open the playground") + " →</a>";
      box.firstChild.appendChild(document.createTextNode(TRY[slug][1] + " in a live git sandbox."));
      var anchor = doc.querySelector(".badges") || doc.querySelector("h1");
      if(anchor) anchor.insertAdjacentElement("afterend", box); else doc.prepend(box);
    }
    buildToc(doc);
    addCopyButtons(doc);
    addGrading(doc);
    footer();
    try{
      mermaid.initialize({startOnLoad:false, theme:"dark", securityLevel:"strict",
        themeVariables:{background:"#0b1c2c", primaryColor:"#0f2438", lineColor:"#94a3b8", fontFamily:"ui-monospace,Menlo,monospace"}});
      mermaid.run({querySelector:".mermaid"});
    }catch(e){}
    if(location.hash){ var t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if(t) t.scrollIntoView(); }
  }).catch(function(){
    doc.innerHTML = '<div class="err">Couldn\'t load this module. <a href="' + REPO + "docs/" + slug + '.md">Read it on GitHub instead →</a></div>';
  });
})();
</script>
</body>
</html>
