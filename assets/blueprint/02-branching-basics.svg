<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="Blueprint: branches as lightweight ref files pointing at commits, with HEAD indicating the current one">
  <title>Branching — anatomy</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c084fc"/></marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:13px;text-anchor:middle;font-weight:600}
  .tiny{fill:#94a3b8;font-size:9.5px;text-anchor:middle}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .road{stroke-linecap:round;fill:none}
  .dot{fill:#fff;stroke-width:3}
  .tag{font-size:10px;font-weight:700;text-anchor:middle}
  
  </style>
  <rect x="0" y="0" width="880" height="380" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="880" height="380" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="878.5" height="378.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Branching — anatomy</text>
  <text class="sub" x="24" y="54">A branch is a movable label; HEAD is a label pointing at whichever branch is checked out</text>
<text class="lbl-l" x="24" y="96" >a branch is a 41-byte text file containing a commit hash — nothing more</text>
<path class="road" d="M60,220 L760,220" stroke="#34d399" stroke-width="15"/>
<circle class="dot" cx="160" cy="220" r="7" stroke="#34d399" stroke-width="3"/>
<circle class="dot" cx="280" cy="220" r="9" stroke="#34d399" stroke-width="3"/>
<rect x="700" y="205" width="70" height="24" rx="12.0" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-width="1.6"/><text class="tag" x="735.0" y="218.0" fill="#34d399">main</text>
<path class="road" d="M280,220 C 380,220 380,140 560,140" stroke="#fbbf24" stroke-width="12"/>
<circle class="dot" cx="440" cy="140" r="7" stroke="#fbbf24" stroke-width="3"/>
<rect x="560" y="125" width="110" height="24" rx="12.0" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1.6"/><text class="tag" x="615.0" y="138.0" fill="#fbbf24">feature/x</text>
<path d="M160,165 L160,212" stroke="#e2e8f0" stroke-width="2" marker-end="url(#ar)"/>
<text class="tiny" x="160" y="150" fill="#e2e8f0" text-anchor="middle" >HEAD (example: on main)</text>
<text class="tiny" x="280" y="255" text-anchor="middle" >.git/refs/heads/main       -> commit hash</text>
<text class="tiny" x="440" y="290" fill="#fbbf24" text-anchor="middle" >.git/refs/heads/feature/x  -> commit hash</text>
<text class="lbl-l" x="440" y="330" text-anchor="middle" >HEAD itself is just a file containing either a branch name (normal) or a raw commit hash (detached)</text></svg>
