<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="Blueprint: git stash push moves dirty working-directory and staged state onto a LIFO stack and restores a clean tree">
  <title>Stashing — anatomy</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c084fc"/></marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:13px;text-anchor:middle;font-weight:600}
  .tiny{fill:#94a3b8;font-size:9.5px;text-anchor:middle}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .road{stroke-linecap:round;fill:none}
  .dot{fill:#fff;stroke-width:3}
  .tag{font-size:10px;font-weight:700;text-anchor:middle}
  
  </style>
  <rect x="0" y="0" width="880" height="360" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="880" height="360" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="878.5" height="358.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Stashing — anatomy</text>
  <text class="sub" x="24" y="54">A LIFO shelf for uncommitted work, separate from any branch history</text>
<text class="lbl-l" x="24" y="96" >stash is a LIFO list of commit-like objects, stored outside any branch, that can restore working-dir + index state</text>
<rect x="60" y="150" width="180" height="90" rx="8" fill="#fb7185" fill-opacity="0.08" stroke="#fb7185" stroke-width="2"/>
<text class="val" x="150.0" y="187.0" text-anchor="middle" >Working dir</text>
<text class="tiny" x="150.0" y="209.0" text-anchor="middle" >dirty, mid-edit</text>
<rect x="340" y="120" width="200" height="150" rx="8" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-width="2"/>
<text class="val" x="440.0" y="195.0" text-anchor="middle" >Stash stack</text>
<rect x="360" y="140" width="160" height="26" rx="13.0" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1.6"/><text class="tag" x="440.0" y="154.0" fill="#fbbf24">stash@{0} "wip"</text>
<rect x="360" y="180" width="160" height="26" rx="13.0" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.6"/><text class="tag" x="440.0" y="194.0" fill="#38bdf8">stash@{1} "wip2"</text>
<rect x="360" y="220" width="160" height="26" rx="13.0" fill="#c084fc" fill-opacity="0.15" stroke="#c084fc" stroke-width="1.6"/><text class="tag" x="440.0" y="234.0" fill="#c084fc">...older entries</text>
<rect x="640" y="150" width="180" height="90" rx="8" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="2"/>
<text class="val" x="730.0" y="187.0" text-anchor="middle" >Working dir</text>
<text class="tiny" x="730.0" y="209.0" text-anchor="middle" >clean again</text>
<path d="M242,195 L338,195" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text class="tiny" x="290" y="180" fill="#fbbf24" text-anchor="middle" >push</text>
<path d="M542,195 L638,195" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text class="tiny" x="590" y="180" fill="#34d399" text-anchor="middle" >pop</text>
<text class="lbl-l" x="440" y="300" text-anchor="middle" >pop = apply top entry THEN drop it  ·  apply = reuse without removing  ·  branch = create a branch FROM a stash</text>
<text class="lbl-l" x="440" y="330" text-anchor="middle" >stash pop that conflicts behaves like a merge conflict — resolve, git add, and it auto-drops; it is NOT lost until you explicitly drop it</text></svg>
