<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="Blueprint: fetch, push and pull, and exactly what each one moves between the local repo and the remote">
  <title>Remote Workflows — anatomy</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c084fc"/></marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:13px;text-anchor:middle;font-weight:600}
  .tiny{fill:#94a3b8;font-size:9.5px;text-anchor:middle}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .road{stroke-linecap:round;fill:none}
  .dot{fill:#fff;stroke-width:3}
  .tag{font-size:10px;font-weight:700;text-anchor:middle}
  
  </style>
  <rect x="0" y="0" width="880" height="340" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="880" height="340" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="878.5" height="338.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Remote Workflows — anatomy</text>
  <text class="sub" x="24" y="54">Three verbs, one relationship between your repo and origin</text>
<text class="lbl-l" x="24" y="96" >fetch only updates your VIEW of the remote; pull also integrates that view into your current branch</text>
<rect x="60" y="140" width="260" height="120" rx="8" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-width="2"/>
<text class="val" x="190.0" y="192.0" text-anchor="middle" >Local repo</text>
<text class="tiny" x="190.0" y="214.0" text-anchor="middle" >main + origin/main (tracking ref)</text>
<rect x="560" y="140" width="260" height="120" rx="8" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="2"/>
<text class="val" x="690.0" y="192.0" text-anchor="middle" >Remote "origin"</text>
<text class="tiny" x="690.0" y="214.0" text-anchor="middle" >main</text>
<path d="M558,175 L322,175" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text class="tiny" x="440" y="162" fill="#38bdf8" text-anchor="middle" >fetch</text>
<path d="M322,215 L558,215" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text class="tiny" x="440" y="202" fill="#34d399" text-anchor="middle" >push</text>
<path d="M558,255 C 480,280 400,280 322,255" stroke="#fbbf24" stroke-width="2.5" fill="none" marker-end="url(#ara)"/>
<text class="tiny" x="440" y="300" fill="#fbbf24" text-anchor="middle" >pull = fetch + merge (or --rebase)</text></svg>
