<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Blueprint: the working directory, staging area and repository, and the commands that move state between them">
  <title>The Three Trees — anatomy</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c084fc"/></marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:13px;text-anchor:middle;font-weight:600}
  .tiny{fill:#94a3b8;font-size:9.5px;text-anchor:middle}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .road{stroke-linecap:round;fill:none}
  .dot{fill:#fff;stroke-width:3}
  .tag{font-size:10px;font-weight:700;text-anchor:middle}
  
  </style>
  <rect x="0" y="0" width="880" height="420" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="880" height="420" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="878.5" height="418.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">The Three Trees — anatomy</text>
  <text class="sub" x="24" y="54">Every git command moves something between exactly these three places</text>
<text class="lbl-l" x="24" y="96" >git add moves changes forward one tree; git commit moves them forward again; checkout/restore move backward</text>
<rect x="60" y="150" width="220" height="110" rx="8" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-width="2"/>
<text class="val" x="170.0" y="197.0" text-anchor="middle" >Working Directory</text>
<text class="tiny" x="170.0" y="219.0" text-anchor="middle" >files on disk, tracked + untracked</text>
<rect x="330" y="150" width="220" height="110" rx="8" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-width="2"/>
<text class="val" x="440.0" y="197.0" text-anchor="middle" >Staging Area</text>
<text class="tiny" x="440.0" y="219.0" text-anchor="middle" >the index — your next commit, drafted</text>
<rect x="600" y="150" width="220" height="110" rx="8" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="2"/>
<text class="val" x="710.0" y="197.0" text-anchor="middle" >Repository</text>
<text class="tiny" x="710.0" y="219.0" text-anchor="middle" >.git objects — permanent history</text>
<path d="M282,205 L328,205" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text class="tiny" x="305" y="190" fill="#fbbf24" text-anchor="middle" >add</text>
<path d="M552,205 L598,205" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text class="tiny" x="575" y="190" fill="#34d399" text-anchor="middle" >commit</text>
<path d="M710,262 C 710,320 170,320 170,262" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" fill="none" marker-end="url(#ar)"/>
<text class="tiny" x="440" y="345" text-anchor="middle" >checkout / restore / reset — pull history back down into earlier trees</text>
<text class="lbl-l" x="440" y="385" text-anchor="middle" >a commit is a full snapshot of the entire tracked tree, plus a pointer to its parent — not a diff</text></svg>
