<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" role="img" aria-label="A matrix ranking common git commands from read-only and reversible to destructive and collaboration-breaking">
  <title>Command risk &amp; reversibility</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c084fc"/></marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:13px;text-anchor:middle;font-weight:600}
  .tiny{fill:#94a3b8;font-size:9.5px;text-anchor:middle}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .road{stroke-linecap:round;fill:none}
  .dot{fill:#fff;stroke-width:3}
  .tag{font-size:10px;font-weight:700;text-anchor:middle}
  
  </style>
  <rect x="0" y="0" width="940" height="560" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="940" height="560" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="938.5" height="558.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Command risk &amp; reversibility</text>
  <text class="sub" x="24" y="54">Green is always safe to try. Rose means think twice and read the flags.</text>
<text class="lbl-l" x="24" y="96" >reversibility is the axis that actually matters when you are about to run a command you are unsure of</text>
<rect x="60" y="130" width="820" height="56" rx="8" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6"/>
<text class="val" x="80" y="152" text-anchor="start" >git status / log / diff</text>
<text class="tiny" x="80" y="172" text-anchor="start" >read-only — cannot break anything</text>
<rect x="60" y="198" width="820" height="56" rx="8" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6"/>
<text class="val" x="80" y="220" text-anchor="start" >git add / commit / branch / stash push</text>
<text class="tiny" x="80" y="240" text-anchor="start" >additive — easy to undo (reset --soft, stash pop)</text>
<rect x="60" y="266" width="820" height="56" rx="8" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-width="1.6"/>
<text class="val" x="80" y="288" text-anchor="start" >git merge / rebase / cherry-pick (clean)</text>
<text class="tiny" x="80" y="308" text-anchor="start" >changes history shape — recoverable via reflog</text>
<rect x="60" y="334" width="820" height="56" rx="8" fill="#fb7185" fill-opacity="0.08" stroke="#fb7185" stroke-width="1.6"/>
<text class="val" x="80" y="356" text-anchor="start" >git reset --hard / checkout -- / clean -fd</text>
<text class="tiny" x="80" y="376" text-anchor="start" >discards uncommitted work — NOT in reflog if never committed</text>
<rect x="60" y="402" width="820" height="56" rx="8" fill="#fb7185" fill-opacity="0.08" stroke="#fb7185" stroke-width="1.6"/>
<text class="val" x="80" y="424" text-anchor="start" >git push --force / branch -D (unmerged)</text>
<text class="tiny" x="80" y="444" text-anchor="start" >affects OTHERS — can destroy shared history</text>
<rect x="60" y="470" width="820" height="56" rx="8" fill="#fb7185" fill-opacity="0.08" stroke="#fb7185" stroke-width="1.6"/>
<text class="val" x="80" y="492" text-anchor="start" >git rebase (already-pushed, shared branch)</text>
<text class="tiny" x="80" y="512" text-anchor="start" >the golden-rule violation — breaks collaborators' history</text></svg>
