<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-label="A map of how fetch, push and pull each move state between a local repository and its origin remote">
  <title>fetch / push / pull at a glance</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c084fc"/></marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:13px;text-anchor:middle;font-weight:600}
  .tiny{fill:#94a3b8;font-size:9.5px;text-anchor:middle}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .road{stroke-linecap:round;fill:none}
  .dot{fill:#fff;stroke-width:3}
  .tag{font-size:10px;font-weight:700;text-anchor:middle}
  
  </style>
  <rect x="0" y="0" width="940" height="420" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="940" height="420" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="938.5" height="418.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">fetch / push / pull at a glance</text>
  <text class="sub" x="24" y="54">Fetch only updates your view; pull also integrates it into your branch</text>
<text class="lbl-l" x="24" y="96" >three verbs, one relationship — know which one touches your branch and which only touches your view of origin</text>
<rect x="80" y="150" width="280" height="130" rx="7" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-width="1.8"/>
<text class="val" x="220.0" y="208.0" text-anchor="middle" >Local repo</text>
<text class="tiny" x="220.0" y="228.0" text-anchor="middle" >main + origin/main (tracking ref)</text>
<rect x="620" y="150" width="280" height="130" rx="7" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-width="1.8"/>
<text class="val" x="760.0" y="208.0" text-anchor="middle" >Remote "origin"</text>
<text class="tiny" x="760.0" y="228.0" text-anchor="middle" >main</text>
<path d="M618,195 C 500,195 460,195 362,195" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<text class="tiny" x="490" y="180" fill="#38bdf8" text-anchor="middle" >fetch — updates origin/main only</text>
<path d="M362,245 C 460,245 500,245 618,245" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#arg)"/>
<text class="tiny" x="490" y="230" fill="#34d399" text-anchor="middle" >push — sends your commits up</text>
<path d="M618,300 C 500,340 500,340 362,300" stroke="#fbbf24" stroke-width="3" fill="none" marker-end="url(#ara)"/>
<text class="tiny" x="490" y="352" fill="#fbbf24" text-anchor="middle" >pull = fetch + merge (or --rebase) into your current branch</text></svg>
