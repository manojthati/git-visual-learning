<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="940" height="620" role="img" aria-label="A map of all eleven modules grouped into foundations, combining-history, everyday-tools, strategy-and-safety, and collaboration-and-advanced families">
  <title>The whole course on one sheet</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
