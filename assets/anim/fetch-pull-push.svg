<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="Animation: fetch updates origin/main without touching your branch, push sends your commits up, and pull combines the two">
  <title>Fetch, push and pull</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c084fc"/></marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:13px;text-anchor:middle;font-weight:600}
  .tiny{fill:#94a3b8;font-size:9.5px;text-anchor:middle}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .road{stroke-linecap:round;fill:none}
  .dot{fill:#fff;stroke-width:3}
  .tag{font-size:10px;font-weight:700;text-anchor:middle}
  
  .fetch,.push,.pullp{opacity:0}
  .fetch{animation:f 9s infinite}
  .push{animation:p 9s infinite}
  .pullp{animation:pl 9s infinite}
  @keyframes f{0%{opacity:0}4%{opacity:0}12%{opacity:1}28%{opacity:1}34%{opacity:0}100%{opacity:0}}
  @keyframes p{0%{opacity:0}34%{opacity:0}42%{opacity:1}58%{opacity:1}64%{opacity:0}100%{opacity:0}}
  @keyframes pl{0%{opacity:0}64%{opacity:0}72%{opacity:1}96%{opacity:1}100%{opacity:0}}

  </style>
  <rect x="0" y="0" width="720" height="260" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="720" height="260" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="718.5" height="258.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Fetch, push and pull</text>
  <text class="sub" x="24" y="54">Fetch only updates your view of the remote; pull also integrates it</text>
<rect x="40" y="60" width="200" height="100" rx="10" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-width="2"/>
<text class="val" x="140" y="90" >Local repo</text>
<text class="tiny" x="140" y="112" >main</text>
<text class="tiny" x="140" y="128" >origin/main (tracking)</text>
<rect x="480" y="60" width="200" height="100" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="2"/>
<text class="val" x="580" y="90" >Remote origin</text>
<text class="tiny" x="580" y="112" >main</text>
<path id="fetch" class="fetch" d="M478,90 C 400,90 320,90 242,90" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#ar)" fill="none"/>
<text class="tiny" x="360" y="76" fill="#38bdf8" text-anchor="middle" >fetch</text>
<path id="push" class="push" d="M242,130 C 320,130 400,130 478,130" stroke="#34d399" stroke-width="2.5" marker-end="url(#arg)" fill="none"/>
<text class="tiny" x="360" y="146" fill="#34d399" text-anchor="middle" >push</text>
<path id="pullp" class="pullp" d="M478,175 C 390,195 390,195 242,175" stroke="#fbbf24" stroke-width="3" marker-end="url(#ara)" fill="none"/>
<text class="tiny" x="360" y="210" fill="#fbbf24" text-anchor="middle" >pull = fetch + merge (or --rebase)</text></svg>
