<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="Animation: git switch -c creates a new branch label at the current commit and moves HEAD to it">
  <title>Creating and switching a branch</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c084fc"/></marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:13px;text-anchor:middle;font-weight:600}
  .tiny{fill:#94a3b8;font-size:9.5px;text-anchor:middle}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .road{stroke-linecap:round;fill:none}
  .dot{fill:#fff;stroke-width:3}
  .tag{font-size:10px;font-weight:700;text-anchor:middle}
  
  .feat{opacity:0;animation:appear 6s infinite}
  @keyframes appear{0%{opacity:0}18%{opacity:0}30%{opacity:1}100%{opacity:1}}

  </style>
  <rect x="0" y="0" width="720" height="260" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="720" height="260" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="718.5" height="258.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Creating and switching a branch</text>
  <text class="sub" x="24" y="54">A branch is a movable label pointing at one commit</text>
<path class="road" d="M40,150 L620,150" stroke="#34d399" stroke-width="16"/>
<circle class="dot" cx="140" cy="150" r="7" stroke="#34d399" stroke-width="3"/>
<circle class="dot" cx="260" cy="150" r="7" stroke="#34d399" stroke-width="3"/>
<rect x="600" y="138" width="70" height="24" rx="12.0" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-width="1.6"/><text class="tag" x="635.0" y="151.0" fill="#34d399">main</text>
<g id="feat" class="feat">
<path class="road" d="M260,150 C 340,150 340,80 480,80" stroke="#fbbf24" stroke-width="13"/>
<circle class="dot" cx="390" cy="80" r="7" stroke="#fbbf24" stroke-width="3"/>
<rect x="480" y="68" width="110" height="24" rx="12.0" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1.6"/><text class="tag" x="535.0" y="81.0" fill="#fbbf24">feature/x</text>
</g>
<text class="tiny" x="260" y="130" text-anchor="middle" >fork point — created by git branch / switch -c</text>
<text class="lbl" x="380" y="220" fill="#fbbf24" text-anchor="middle" >git switch -c feature/x</text>
<text class="tiny" x="380" y="240" text-anchor="middle" >HEAD now points at feature/x, which points at this commit</text></svg>
