<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-label="Animation: git cherry-pick copies a single commit from branch-B onto branch-A, leaving branch-B fully intact">
  <title>Cherry-pick copies one commit</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c084fc"/></marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:13px;text-anchor:middle;font-weight:600}
  .tiny{fill:#94a3b8;font-size:9.5px;text-anchor:middle}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .road{stroke-linecap:round;fill:none}
  .dot{fill:#fff;stroke-width:3}
  .tag{font-size:10px;font-weight:700;text-anchor:middle}
  
  .copy{opacity:0;animation:cp 6s infinite}
  @keyframes cp{0%{opacity:0}30%{opacity:0}42%{opacity:1}100%{opacity:1}}

  </style>
  <rect x="0" y="0" width="720" height="240" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="720" height="240" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="718.5" height="238.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Cherry-pick copies one commit</text>
  <text class="sub" x="24" y="54">Everything else on the donor branch stays exactly where it was</text>
<path class="road" d="M40,170 L420,170" stroke="#38bdf8" stroke-width="14"/>
<circle class="dot" cx="120" cy="170" r="7" stroke="#38bdf8" stroke-width="3"/>
<circle class="dot" cx="220" cy="170" r="9" stroke="#fbbf24" stroke-width="3"/>
<circle class="dot" cx="320" cy="170" r="7" stroke="#38bdf8" stroke-width="3"/>
<rect x="360" y="185" width="80" height="20" rx="10.0" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.6"/><text class="tag" x="400.0" y="196.0" fill="#38bdf8">branch-B</text>
<circle cx="220" cy="170" r="16" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3"/>
<text class="tiny" x="220" y="145" fill="#fbbf24" text-anchor="middle" >pick just this one</text>
<path class="road" d="M40,70 L300,70" stroke="#34d399" stroke-width="14"/>
<circle class="dot" cx="120" cy="70" r="7" stroke="#34d399" stroke-width="3"/>
<circle class="dot" cx="200" cy="70" r="7" stroke="#34d399" stroke-width="3"/>
<rect x="20" y="40" width="70" height="20" rx="10.0" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-width="1.6"/><text class="tag" x="55.0" y="51.0" fill="#34d399">branch-A</text>
<g id="copy" class="copy">
<path d="M225,158 C 250,120 270,95 295,78" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="5,4" marker-end="url(#ara)"/>
<circle class="dot" cx="310" cy="70" r="8" stroke="#fbbf24" stroke-width="3"/>
</g>
<text class="tiny" x="500" y="90" >branch-B is untouched — all its commits, including the</text>
<text class="tiny" x="500" y="106" >picked one, stay exactly where they were.</text>
<text class="tiny" x="500" y="130" fill="#fbbf24" >a COPY of that one commit lands on branch-A.</text></svg>
