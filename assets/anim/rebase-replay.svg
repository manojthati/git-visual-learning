<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="Animation: rebase lifts feature's commits off their old base and replays them on top of main's current tip">
  <title>Rebase replays commits onto a new base</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.09"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c084fc"/></marker>
  </defs>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;dominant-baseline:middle}
  .title{fill:#e2e8f0;font-size:17px;font-weight:700;dominant-baseline:auto}
  .sub{fill:#94a3b8;font-size:12px;dominant-baseline:auto}
  .lbl{fill:#94a3b8;font-size:11px;text-anchor:middle}
  .lbl-l{fill:#94a3b8;font-size:11px}
  .val{fill:#e2e8f0;font-size:13px;text-anchor:middle;font-weight:600}
  .tiny{fill:#94a3b8;font-size:9.5px;text-anchor:middle}
  .step{fill:#fbbf24;font-size:12px;font-weight:700}
  .road{stroke-linecap:round;fill:none}
  .dot{fill:#fff;stroke-width:3}
  .tag{font-size:10px;font-weight:700;text-anchor:middle}
  
  #ghost{animation:gh 6s infinite}
  .lift{opacity:0;animation:lf 6s infinite}
  .newfeat{opacity:0;animation:nf 6s infinite}
  @keyframes gh{0%{opacity:1}36%{opacity:1}46%{opacity:0.25}100%{opacity:0.25}}
  @keyframes lf{0%{opacity:0}30%{opacity:0}42%{opacity:1}62%{opacity:1}70%{opacity:0}100%{opacity:0}}
  @keyframes nf{0%{opacity:0}58%{opacity:0}66%{opacity:1}100%{opacity:1}}

  </style>
  <rect x="0" y="0" width="720" height="280" rx="14" fill="#0b1c2c"/>
  <rect x="0" y="0" width="720" height="280" rx="14" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="718.5" height="278.5" rx="13.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <text class="title" x="24" y="34">Rebase replays commits onto a new base</text>
  <text class="sub" x="24" y="54">Same changes, brand-new commits with brand-new hashes</text>
<path class="road" d="M40,90 L460,90" stroke="#34d399" stroke-width="15"/>
<circle class="dot" cx="130" cy="90" r="7" stroke="#34d399" stroke-width="3"/>
<circle class="dot" cx="230" cy="90" r="7" stroke="#34d399" stroke-width="3"/>
<circle class="dot" cx="330" cy="90" r="8" stroke="#34d399" stroke-width="3"/>
<rect x="390" y="60" width="70" height="22" rx="11.0" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-width="1.6"/><text class="tag" x="425.0" y="72.0" fill="#34d399">main</text>
<g id="ghost">
<path class="road" d="M130,90 C 180,90 180,190 330,190" stroke="#fbbf24" stroke-width="11"/>
<circle class="dot" cx="280" cy="190" r="6" stroke="#fbbf24" stroke-width="2"/>
<circle class="dot" cx="330" cy="190" r="6" stroke="#fbbf24" stroke-width="2"/>
</g>
<text class="tiny" x="230" y="218" fill="#fbbf24" text-anchor="middle" >feature — before, forked back when main was shorter</text>
<g id="lift" class="lift"><path d="M300,180 C 380,140 420,120 450,105" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#ara)"/><text class="lbl" x="420" y="150" fill="#fbbf24" text-anchor="middle">picked up and replayed</text></g>
<g id="newfeat" class="newfeat">
<path class="road" d="M460,90 L640,90" stroke="#fbbf24" stroke-width="13"/>
<circle class="dot" cx="530" cy="90" r="7" stroke="#fbbf24" stroke-width="3"/>
<circle class="dot" cx="600" cy="90" r="7" stroke="#fbbf24" stroke-width="3"/>
<rect x="560" y="58" width="100" height="22" rx="11.0" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1.6"/><text class="tag" x="610.0" y="70.0" fill="#fbbf24">feature (after)</text>
</g>
<text class="lbl" x="360" y="258" text-anchor="middle" >git rebase main  —  same two commits, new base, new hashes</text></svg>
